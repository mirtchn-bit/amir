<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX SHOP — Global Marketplace & Cargo</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: #111827;
            --accent-cyan: #00d4ff;
            --accent-emerald: #10b981;
            --accent-indigo: #3b82f6;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border: #1f2937;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        .top-promo {
            background: linear-gradient(90deg, #0b192c, #0f2942, #0b192c);
            border-bottom: 1px solid rgba(0, 212, 255, 0.3);
            padding: 8px 16px;
            text-align: center;
            font-size: 12px;
            letter-spacing: 0.6px;
            color: #bae6fd;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 18px 20px 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            background: rgba(17, 24, 39, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            padding: 16px 22px;
            border-radius: 16px;
            margin-bottom: 24px;
            position: sticky;
            top: 10px;
            z-index: 500;
        }

        .brand-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-mark {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-indigo));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 20px;
            color: #06101d;
            box-shadow: 0 0 18px rgba(0, 212, 255, 0.45);
        }

        header h1 {
            font-size: 22px;
            letter-spacing: 2px;
            font-weight: 900;
        }

        header h1 span {
            color: var(--accent-cyan);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .acc-chip {
            background: #0f172a;
            border: 1px solid rgba(0, 212, 255, 0.35);
            padding: 8px 13px;
            border-radius: 10px;
            font-size: 12px;
            display: none;
        }

        .acc-chip b {
            color: var(--accent-cyan);
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.25s;
        }

        .tab-btn.active, .tab-btn:hover {
            color: #fff;
            border-color: var(--accent-cyan);
            background: rgba(0, 212, 255, 0.12);
        }

        button {
            cursor: pointer;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 800;
            letter-spacing: 0.5px;
            font-size: 12px;
            text-transform: uppercase;
            transition: all 0.25s ease;
        }
