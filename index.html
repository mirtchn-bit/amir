<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPTOM MARKET — Premium Perfume Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            900: '#14532d',
                        },
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-brand-500 selection:text-white antialiased" id="appBody">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDocs, updateDoc, deleteDoc, onSnapshot, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'luxe-store-default';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "demo-key", authDomain: "demo.firebaseapp.com", projectId: "demo-project", storageBucket: "demo.appspot.com", messagingSenderId: "123456", appId: "1:123:web:abc"
        };

        let app, db, auth;
        let currentUser = null;
        let registeredUser = null; 
        let products = [];
        let orders = [];
        let cart = [];
        let wishlist = [];
        let activeTab = 'store'; 
        let currentCategory = 'all';
        let searchQuery = '';
        let isAdminAuthenticated = false;

        // 100 TA ATIR RO'YXATI
        const perfumeBrands = ["Baccarat Rouge 540", "Creed Aventus", "Dior Sauvage", "Tom Ford Tobacco Vanille", "Bleu de Chanel", "Giorgio Armani Acqua Di Gio", "Versace Eros", "YSL Libre", "Tom Ford Lost Cherry", "Amoage Interlude"];
        const perfumeTypes = ["Erkaklar uchun", "Ayollar uchun", "Unisex"];
        const perfumeImages = [
            "https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1541643600914-78b084683601?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1523293182086-7651a899d37f?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1588405748880-12d1d2a59f75?auto=format&fit=crop&w=800&q=80"
        ];

        const defaultProducts = [];
        for (let i = 1; i <= 100; i++) {
            const brand = perfumeBrands[(i - 1) % perfumeBrands.length];
            const pType = perfumeTypes[(i - 1) % perfumeTypes.length];
            const img = perfumeImages[(i - 1) % perfumeImages.length];
            const price = 450000 + (i * 15000);
            
            defaultProducts.push({
                id: "perfume_" + i,
                name: `${brand} Edition N°${i}`,
                category: "atir",
                price: price,
                bulkPrice: Math.round(price * 0.85),
                bulkQty: 3,
                stock: 15 + (i % 10),
                image: img,
                description: `O'ziga jalb etuvchi va uzoq saqlanuvchi ${pType} atir. Premium parfum 100ml.`
            });
        }

        async function initApp() {
            try {
                // Mahalliy saqlangan mahsulotlarni yuklash
                products = [...defaultProducts];

                const localCart = localStorage.getItem('optom_cart');
                if (localCart) cart = JSON.parse(localCart);
                
                const localWish = localStorage.getItem('optom_wishlist');
                if (localWish) wishlist = JSON.parse(localWish);

                const localUser = localStorage.getItem('optom_user_profile');
                if (localUser) registeredUser = JSON.parse(localUser);

                renderProducts();
                updateUserUI();
                updateCartBadge();
                updateWishlistBadge();

            } catch (err) {
                console.error("Initialization error:", err);
            }
        }

        window.validateUzPhone = function(phoneStr) {
            const digits = phoneStr.replace(/\D/g, '');
            let num = digits;
            if (num.length === 9) num = '998' + num;
            if (num.length !== 12 || !num.startsWith('998')) {
                return { valid: false, message: "Telefon raqami noto'g'ri! Masalan: +998 90 123 45 67" };
            }
            return { valid: true, formatted: `+${num.substring(0,3)} (${num.substring(3,5)}) ${num.substring(5,8)}-${num.substring(8,10)}-${num.substring(10,12)}` };
        };

        window.formatMoney = function(amount) {
            return new Intl.NumberFormat('uz-UZ').format(amount) + " so'm";
        };

        window.showToast = function(message, type = 'success') {
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-brand-600' : 'bg-rose-600';
            toast.className = `fixed bottom-6 right-6 ${bgClass} text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 z-50 transition-all duration-300`;
            toast.innerHTML = `<span class="font-medium text-sm">${message}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        };

        window.renderProducts = function() {
            const grid = document.getElementById('productsGrid');
            if (!grid) return;

            let filtered = products.filter(p => {
                const matchesCat = currentCategory === 'all' || p.category === currentCategory;
                const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCat && matchesSearch;
            });

            grid.innerHTML = filtered.map(product => `
                <div class="bg-slate-900 border border-slate-800 hover:border-brand-500/50 rounded-2xl overflow-hidden flex flex-col justify-between p-4">
                    <img src="${product.image}" class="w-full h-48 object-cover rounded-xl bg-slate-800 mb-3">
                    <div>
                        <span class="text-[10px] text-brand-400 uppercase font-bold tracking-wider">${product.category}</span>
                        <h3 class="font-bold text-white text-base line-clamp-1">${product.name}</h3>
                        <p class="text-xs text-slate-400 mt-1 line-clamp-2">${product.description}</p>
                    </div>
                    <div class="mt-4 pt-3 border-t border-slate-800">
                        <div class="text-lg font-bold text-white">${formatMoney(product.price)}</div>
                        <div class="text-xs text-emerald-400 font-medium">${product.bulkQty}+ ta: ${formatMoney(product.bulkPrice)}</div>
                        <button onclick="addToCart('${product.id}')" class="w-full mt-3 bg-brand-600 hover:bg-brand-500 text-white font-bold py-2 rounded-xl text-xs">
                            Savatga qo'shish
                        </button>
                    </div>
                </div>
            `).join('');
        };

        window.addToCart = function(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;
            const existing = cart.find(item => item.id === productId);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ id: productId, qty: 1 });
            }
            localStorage.setItem('optom_cart', JSON.stringify(cart));
            updateCartBadge();
            showToast(`"${product.name}" savatga qo'shildi`);
        };

        function updateCartBadge() {
            const badge = document.getElementById('cartBadge');
            const total = cart.reduce((a, b) => a + b.qty, 0);
            if (badge) {
                badge.innerText = total;
                badge.classList.toggle('hidden', total === 0);
            }
        }

        function updateWishlistBadge() {}
        function updateUserUI() {}

        document.addEventListener('DOMContentLoaded', () => {
            initApp();
            document.getElementById('searchInput')?.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderProducts();
            });
        });
    </script>

    <!-- Header -->
    <header class="sticky top-0 z-40 glass border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white font-bold">
                    <i class="fa-solid fa-spray-can text-xl"></i>
                </div>
                <span class="text-xl font-extrabold text-white">OPTOM<span class="text-brand-500"> PERFUME</span></span>
            </div>
            <div class="flex items-center space-x-4">
                <button class="relative bg-slate-900 border border-slate-700 p-3 rounded-xl text-white">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="cartBadge" class="hidden absolute -top-1 -right-1 bg-brand-500 text-slate-950 text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8 space-y-6">
        <div class="flex items-center justify-between bg-slate-900 p-4 rounded-2xl border border-slate-800">
            <input type="text" id="searchInput" placeholder="Atirlarni qidirish..." class="w-full bg-slate-950 border border-slate-800 text-sm text-slate-100 px-4 py-3 rounded-xl outline-none">
        </div>

        <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- 100 ta atir rasmi va narxi dinamik ravishda shu yerga yuklanadi -->
        </div>
    </main>
</body>
</html>
